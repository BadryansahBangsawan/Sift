name: Sift
options:
  bundleIdPrefix: com.sift
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_ENTITLEMENTS: "Sift/Sift.entitlements"
    INFOPLIST_FILE: "Sift/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: "com.sift.app"
    MARKETING_VERSION: "4.1.2"
    CURRENT_PROJECT_VERSION: "37"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  Sift:
    type: application
    platform: macOS
    sources:
      - Sift
    settings:
      base:
        PRODUCT_NAME: Sift
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"

  SiftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SiftTests
    dependencies:
      - target: Sift
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

schemes:
  Sift:
    build:
      targets:
        Sift: all
        SiftTests: [test]
    test:
      targets:
        - name: SiftTests
